# AATOS CI/CD Pipeline

name: AATOS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aatos
          POSTGRES_PASSWORD: aatos_test
          POSTGRES_DB: aatos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npm run lint
      - run: cd backend && npm run build
      - name: Run schema drift detector
        run: cd backend && npx ts-node src/database/schema-drift-detector.ts
      - name: Verify migrations run clean from empty database
        run: cd backend && npx typeorm migration:run -d dist/database/data-source.js
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aatos:aatos_test@localhost:5432/aatos_test
          JWT_SECRET: test-secret-key-32-chars-long!!
          JWT_REFRESH_SECRET: test-refresh-secret-key-32!!
      - run: cd backend && npm run test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aatos:aatos_test@localhost:5432/aatos_test
          JWT_SECRET: test-secret-key-32-chars-long!!
          JWT_REFRESH_SECRET: test-refresh-secret-key-32!!

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm run build
      - name: Check CSS budget
        run: |
          CSS_SIZE=$(stat -c%s web/dist/assets/*.css | sort -n | tail -1)
          if [ "$CSS_SIZE" -lt 5120 ]; then
            echo "CSS budget check failed: ${CSS_SIZE} bytes (min: 5120 bytes)"
            exit 1
          fi
          echo "CSS budget OK: ${CSS_SIZE} bytes"

  deploy-staging:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy Frontend to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web
          alias-domains: |
            aatos-staging.vercel.app
      - name: Deploy Backend to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          working-directory: ./backend

  deploy-production:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy Frontend to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web
          vercel-args: '--prod'
      - name: Deploy Backend to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          working-directory: ./backend
          vercel-args: '--prod'
