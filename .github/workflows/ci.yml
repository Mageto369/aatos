name: CI/CD Pipeline

on:
  push:
    branches: [master, main, 'phase-*']
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aatos
          POSTGRES_PASSWORD: aatos_test
          POSTGRES_DB: aatos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run unit tests
        run: npm test -- --coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aatos:aatos_test@localhost:5432/aatos_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-min-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-min-32-chars-long
      
      - name: Run migrations
        run: npm run migration:run
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aatos:aatos_test@localhost:5432/aatos_test
          JWT_SECRET: test-secret-min-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-min-32-chars-long
      
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aatos:aatos_test@localhost:5432/aatos_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-min-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-min-32-chars-long
      
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./web/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aatos
          POSTGRES_PASSWORD: aatos_test
          POSTGRES_DB: aatos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Test migration schema
        run: |
          cd backend
          npm ci
          npm run migration:run
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aatos:aatos_test@localhost:5432/aatos_test
          JWT_SECRET: test-secret-min-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-min-32-chars-long
      
      - name: Verify schema integrity
        run: |
          psql postgresql://aatos:aatos_test@localhost:5432/aatos_test -c "\dt" | grep -E "(organizations|users|products|deals|payments|messages)"
        env:
          PGPASSWORD: aatos_test
      
      - name: Test seed data
        run: |
          cd backend
          npx ts-node -r tsconfig-paths/register src/database/seed.ts
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aatos:aatos_test@localhost:5432/aatos_test
